global:
  namespaces: {mcp: mcp}
image: {repository: k8s-mcp-gateway/aux-mcp, tag: 0.1.0-local, pullPolicy: IfNotPresent}
existingSecret: aux-mcp
currency:
  service: {name: currency-mcp, port: 8000}
policy:
  service: {name: policy-mcp, port: 8000}
probes: {livenessPath: /healthz, readinessPath: /readyz}
resources:
  requests: {cpu: 25m, memory: 96Mi}
  limits: {cpu: 250m, memory: 256Mi}
