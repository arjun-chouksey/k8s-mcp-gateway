{{- $_ := required "aux-mcp.existingSecret is required" .Values.existingSecret -}}
{{- range $name, $server := dict "currency" .Values.currency "policy" .Values.policy "analytics" .Values.analytics }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $server.service.name }}
  namespace: {{ $.Values.global.namespaces.mcp }}
  labels:
    app.kubernetes.io/name: {{ $name }}-mcp
    app.kubernetes.io/part-of: k8s-mcp-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}-mcp
  ports:
    - name: mcp
      port: {{ $server.service.port }}
      targetPort: mcp
---
{{- end }}
