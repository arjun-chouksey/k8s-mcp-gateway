global:
  namespaces:
    store: store
    mcp: mcp
    platform: platform
  hosts:
    shop: shop.127.0.0.1.nip.io
    app: app.127.0.0.1.nip.io
  ingress:
    className: traefik
    externalPort: 8080
    tls:
      enabled: false
      secretName: ""
  storageClass: local-path
  imagePullPolicy: IfNotPresent

store:
  wordpress:
    image:
      repository: wordpress
      tag: 7.1.3-php8.3-apache
    service:
      name: wordpress
      port: 80
    existingSecret: store-wordpress
    bootstrap:
      enabled: true
      adminExistingSecret: store-wordpress-admin
      cliImage:
        repository: wordpress
        tag: cli-2.12.0-php8.3
      wordpressVersion: 7.1.3
      woocommerceVersion: 11.2.1
      timezone: Asia/Kolkata
      currency: INR
      product:
        name: Demo Virtual Product
        sku: urumi-demo-virtual
        price: "499.00"
    persistence:
      size: 2Gi
    probes:
      path: /wp-login.php
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  mariadb:
    image:
      repository: mariadb
      tag: 11.8.3
    service:
      name: mariadb
      port: 3306
    existingSecret: store-mariadb
    persistence:
      size: 2Gi
    probes:
      command: healthcheck.sh
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 750m, memory: 768Mi}

woo-mcp:
  image:
    repository: k8s-mcp-gateway/woo-mcp
    tag: 0.1.0-local
    pullPolicy: IfNotPresent
  service:
    name: woocommerce-mcp
    port: 8000
  existingSecret: woo-mcp
  storeTimezone: Asia/Kolkata
  probes:
    livenessPath: /healthz
    readinessPath: /readyz
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

aux-mcp:
  image:
    repository: k8s-mcp-gateway/aux-mcp
    tag: 0.1.0-local
    pullPolicy: IfNotPresent
  existingSecret: aux-mcp
  currency:
    service:
      name: currency-mcp
      port: 8000
  policy:
    service:
      name: policy-mcp
      port: 8000
  probes:
    livenessPath: /healthz
    readinessPath: /readyz
  resources:
    requests: {cpu: 25m, memory: 96Mi}
    limits: {cpu: 250m, memory: 256Mi}

gateway:
  image:
    repository: k8s-mcp-gateway/gateway
    tag: 0.1.0-local
  service:
    name: gateway
    port: 8000
  existingSecret: gateway
  databaseExistingSecret: platform-postgres
  bootstrapExistingSecret: gateway-bootstrap-admin
  probes:
    livenessPath: /healthz
    readinessPath: /readyz
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  auth:
    allowedOrigin: http://app.127.0.0.1.nip.io:8080
    cookieSecure: false
    sessionTtlSeconds: 28800
    loginMaxFailures: 5
    loginWindowSeconds: 300
  bootstrap:
    enabled: true
    ttlSecondsAfterFinished: 3600
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
  migrations:
    enabled: true
    ttlSecondsAfterFinished: 3600
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}

platform-db:
  image:
    repository: postgres
    tag: 17.6-alpine
  service:
    name: postgres
    port: 5432
  existingSecret: platform-postgres
  persistence:
    size: 2Gi
  probes:
    command: pg_isready
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

dashboard:
  image:
    repository: k8s-mcp-gateway/dashboard
    tag: 0.1.0-local
  service:
    name: dashboard
    port: 80
  probes:
    livenessPath: /healthz
    readinessPath: /healthz
  resources: {}
