global:
  hosts:
    shop: shop.example.com
    app: app.example.com
  ingress:
    externalPort: 443
    tls:
      enabled: true
      secretName: platform-ingress-tls
  storageClass: local-path
  imagePullPolicy: IfNotPresent

store:
  wordpress:
    existingSecret: store-wordpress
    bootstrap:
      adminExistingSecret: store-wordpress-admin
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  mariadb:
    existingSecret: store-mariadb
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

woo-mcp:
  image:
    repository: ghcr.io/arjun-chouksey/k8s-mcp-gateway/woo-mcp
    tag: 0.1.0
  existingSecret: woo-mcp

aux-mcp:
  image:
    repository: ghcr.io/arjun-chouksey/k8s-mcp-gateway/aux-mcp
    tag: 0.1.0
  existingSecret: aux-mcp

gateway:
  image:
    repository: ghcr.io/arjun-chouksey/k8s-mcp-gateway/gateway
    tag: 0.1.0
  existingSecret: gateway
  databaseExistingSecret: platform-postgres
  bootstrapExistingSecret: gateway-bootstrap-admin
  llm:
    existingSecret: gateway
  upstreamBootstrap:
    existingSecret: gateway-upstreams
  auth:
    allowedOrigin: https://app.example.com
    cookieSecure: true

platform-db:
  existingSecret: platform-postgres
  persistence:
    size: 10Gi

dashboard:
  image:
    repository: ghcr.io/arjun-chouksey/k8s-mcp-gateway/dashboard
    tag: 0.1.0
