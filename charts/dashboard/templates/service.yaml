apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.global.namespaces.platform }}
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: k8s-mcp-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
