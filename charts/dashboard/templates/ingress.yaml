apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: {{ .Values.global.namespaces.platform }}
  labels:
    app.kubernetes.io/part-of: k8s-mcp-gateway
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.global.hosts.app | quote }}]
      secretName: {{ required "global.ingress.tls.secretName is required when TLS is enabled" .Values.global.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.hosts.app | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.name }}
                port:
                  number: {{ .Values.service.port }}
