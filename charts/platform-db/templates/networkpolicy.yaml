apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: {{ .Values.global.namespaces.platform }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: k8s-mcp-gateway
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [gateway, gateway-migrate, gateway-bootstrap-admin, gateway-bootstrap-upstream]
      ports:
        - {protocol: TCP, port: {{ .Values.service.port }}}
