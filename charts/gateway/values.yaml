global:
  namespaces: {platform: platform, mcp: mcp}
  hosts: {app: app.127.0.0.1.nip.io}
  ingress:
    className: traefik
    tls: {enabled: false, secretName: ""}
image: {repository: k8s-mcp-gateway/gateway, tag: 0.1.0-local}
service: {name: gateway, port: 8000}
databasePort: 5432
existingSecret: gateway
databaseExistingSecret: platform-postgres
bootstrapExistingSecret: gateway-bootstrap-admin
llm:
  existingSecret: gateway
  secretKey: groq-api-key
  baseUrl: https://api.groq.com/openai/v1
  model: openai/gpt-oss-20b
  mcpUrl: http://gateway.platform.svc.cluster.local:8000/mcp
  maxRounds: 6
  totalTimeoutSeconds: 90
upstream:
  port: 8000
  refreshSeconds: 30
  internalAllowlist:
    - woocommerce-mcp.mcp.svc.cluster.local:8000
    - currency-mcp.mcp.svc.cluster.local:8000
    - policy-mcp.mcp.svc.cluster.local:8000
    - analytics-mcp.mcp.svc.cluster.local:8000
probes: {livenessPath: /healthz, readinessPath: /readyz}
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
auth:
  allowedOrigin: http://app.127.0.0.1.nip.io:8080
  cookieSecure: false
  sessionTtlSeconds: 28800
  inviteTtlSeconds: 86400
  loginMaxFailures: 5
  loginWindowSeconds: 300
bootstrap:
  enabled: true
  ttlSecondsAfterFinished: 3600
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
upstreamBootstrap:
  enabled: true
  existingSecret: gateway-upstreams
  credentialKey: woo-credential
  slug: woo
  displayName: WooCommerce
  url: http://woocommerce-mcp.mcp.svc.cluster.local:8000/mcp
  connectTimeoutMs: 3000
  callTimeoutMs: 20000
  ttlSecondsAfterFinished: 3600
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
migrations:
  enabled: true
  ttlSecondsAfterFinished: 3600
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
