{{- $_ := required "gateway.databaseExistingSecret is required" .Values.databaseExistingSecret -}}
{{- $_ := required "gateway.llm.existingSecret is required" .Values.llm.existingSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.global.namespaces.platform }}
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: k8s-mcp-gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: k8s-mcp-gateway}
    spec:
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports: [{name: http, containerPort: {{ .Values.service.port }}}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.databaseExistingSecret }}, key: database-url}}
            - name: API_KEY_PEPPER
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: api-key-pepper}}
            - name: UPSTREAM_CREDENTIAL_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: upstream-credential-key}}
            - name: INTERNAL_JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: internal-jwt-secret}}
            - name: GROQ_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.llm.existingSecret }}, key: {{ .Values.llm.secretKey }}}}
            - {name: LLM_BASE_URL, value: {{ .Values.llm.baseUrl | quote }} }
            - {name: LLM_MODEL, value: {{ .Values.llm.model | quote }} }
            - {name: CHAT_MCP_URL, value: {{ .Values.llm.mcpUrl | quote }} }
            - {name: CHAT_MAX_ROUNDS, value: {{ .Values.llm.maxRounds | quote }} }
            - {name: CHAT_TOTAL_TIMEOUT_SECONDS, value: {{ .Values.llm.totalTimeoutSeconds | quote }} }
            - {name: UPSTREAM_INTERNAL_ALLOWLIST, value: {{ join "," .Values.upstream.internalAllowlist | quote }}}
            - {name: UPSTREAM_REFRESH_SECONDS, value: {{ .Values.upstream.refreshSeconds | quote }}}
            - {name: ALLOWED_ORIGIN, value: {{ .Values.auth.allowedOrigin | quote }}}
            - {name: COOKIE_SECURE, value: {{ .Values.auth.cookieSecure | quote }}}
            - {name: SESSION_TTL_SECONDS, value: {{ .Values.auth.sessionTtlSeconds | quote }}}
            - {name: INVITE_TTL_SECONDS, value: {{ .Values.auth.inviteTtlSeconds | quote }}}
            - {name: LOGIN_MAX_FAILURES, value: {{ .Values.auth.loginMaxFailures | quote }}}
            - {name: LOGIN_WINDOW_SECONDS, value: {{ .Values.auth.loginWindowSeconds | quote }}}
            - {name: FORWARDED_ALLOW_IPS, value: {{ .Values.auth.forwardedAllowIps | quote }}}
          startupProbe:
            httpGet: {path: {{ .Values.probes.readinessPath }}, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readinessPath }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: {{ .Values.probes.livenessPath }}, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
