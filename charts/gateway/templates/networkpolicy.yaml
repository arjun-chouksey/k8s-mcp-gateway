apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: {{ .Values.global.namespaces.platform }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: k8s-mcp-gateway
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gateway}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gateway}
      ports:
        - {protocol: TCP, port: {{ .Values.service.port }}}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.global.namespaces.mcp }}}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [woo-mcp, currency-mcp, policy-mcp, analytics-mcp]
      ports:
        - {protocol: TCP, port: {{ .Values.upstream.port }}}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports:
        - {protocol: TCP, port: {{ .Values.databasePort }}}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gateway}
      ports:
        - {protocol: TCP, port: {{ .Values.service.port }}}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {protocol: TCP, port: 443}
