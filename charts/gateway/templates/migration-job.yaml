{{- $_ := required "gateway.databaseExistingSecret is required" .Values.databaseExistingSecret -}}
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-migrate-{{ .Release.Revision }}
  namespace: {{ .Values.global.namespaces.platform }}
  labels: {app.kubernetes.io/name: gateway-migrate, app.kubernetes.io/part-of: k8s-mcp-gateway}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway-migrate, app.kubernetes.io/part-of: k8s-mcp-gateway}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: wait-for-database
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command:
            - python
            - -c
            - |
              import os, time
              import psycopg
              database_url = os.environ["DATABASE_URL"].replace(
                  "postgresql+psycopg://", "postgresql://", 1
              )
              for attempt in range(120):
                  try:
                      with psycopg.connect(database_url, connect_timeout=3):
                          raise SystemExit(0)
                  except psycopg.OperationalError:
                      if attempt == 119:
                          raise
                      time.sleep(2)
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.databaseExistingSecret }}, key: database-url}}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.databaseExistingSecret }}, key: database-url}}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
{{- end }}
