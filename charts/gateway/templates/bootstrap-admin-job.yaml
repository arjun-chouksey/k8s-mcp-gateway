{{- $_ := required "gateway.bootstrapExistingSecret is required" .Values.bootstrapExistingSecret -}}
{{- $_ := required "gateway.databaseExistingSecret is required" .Values.databaseExistingSecret -}}
{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-bootstrap-admin
  namespace: {{ .Values.global.namespaces.platform }}
  labels: {app.kubernetes.io/name: gateway-bootstrap-admin, app.kubernetes.io/part-of: k8s-mcp-gateway}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: {{ .Values.bootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway-bootstrap-admin, app.kubernetes.io/part-of: k8s-mcp-gateway}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command: [python, -m, app.bootstrap_admin]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.databaseExistingSecret }}, key: database-url}}
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom: {secretKeyRef: {name: {{ .Values.bootstrapExistingSecret }}, key: email}}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.bootstrapExistingSecret }}, key: password}}
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
{{- end }}
