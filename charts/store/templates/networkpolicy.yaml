apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress
  namespace: {{ .Values.global.namespaces.store }}
  labels:
    app.kubernetes.io/part-of: k8s-mcp-gateway
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: wordpress}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.global.namespaces.mcp }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: woo-mcp}
      ports:
        - {protocol: TCP, port: {{ .Values.wordpress.service.port }}}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: mariadb}
      ports:
        - {protocol: TCP, port: {{ .Values.mariadb.service.port }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
  namespace: {{ .Values.global.namespaces.store }}
  labels:
    app.kubernetes.io/part-of: k8s-mcp-gateway
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: mariadb}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [wordpress, store-bootstrap]
      ports:
        - {protocol: TCP, port: {{ .Values.mariadb.service.port }}}
