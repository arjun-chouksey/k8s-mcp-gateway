{{- if .Values.wordpress.bootstrap.enabled }}
{{- $scheme := ternary "https" "http" .Values.global.ingress.tls.enabled -}}
{{- $port := int .Values.global.ingress.externalPort -}}
{{- $standardPort := or (and (eq $scheme "http") (eq $port 80)) (and (eq $scheme "https") (eq $port 443)) -}}
{{- $authority := .Values.global.hosts.shop -}}
{{- if not $standardPort -}}
{{- $authority = printf "%s:%d" $authority $port -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: store-bootstrap
  namespace: {{ .Values.global.namespaces.store }}
  labels:
    app.kubernetes.io/name: store-bootstrap
    app.kubernetes.io/part-of: k8s-mcp-gateway
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-bootstrap
        app.kubernetes.io/part-of: k8s-mcp-gateway
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "{{ .Values.wordpress.bootstrap.cliImage.repository }}:{{ .Values.wordpress.bootstrap.cliImage.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ .Values.mariadb.service.name }}:{{ .Values.mariadb.service.port }}"
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wordpress.existingSecret }}
                  key: database
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wordpress.existingSecret }}
                  key: username
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wordpress.existingSecret }}
                  key: password
            - name: SITE_URL
              value: "{{ $scheme }}://{{ $authority }}"
            - name: WP_CLI_CACHE_DIR
              value: /tmp/wp-cli-cache
            - name: WORDPRESS_VERSION
              value: {{ .Values.wordpress.bootstrap.wordpressVersion | quote }}
            - name: STORE_TIMEZONE
              value: {{ .Values.wordpress.bootstrap.timezone | quote }}
            - name: STORE_CURRENCY
              value: {{ .Values.wordpress.bootstrap.currency | quote }}
            - name: WOOCOMMERCE_VERSION
              value: {{ .Values.wordpress.bootstrap.woocommerceVersion | quote }}
            - name: DEMO_PRODUCT_NAME
              value: {{ .Values.wordpress.bootstrap.product.name | quote }}
            - name: DEMO_PRODUCT_SKU
              value: {{ .Values.wordpress.bootstrap.product.sku | quote }}
            - name: DEMO_PRODUCT_PRICE
              value: {{ .Values.wordpress.bootstrap.product.price | quote }}
            - name: WORDPRESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wordpress.bootstrap.adminExistingSecret }}
                  key: username
            - name: WORDPRESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wordpress.bootstrap.adminExistingSecret }}
                  key: password
            - name: WORDPRESS_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wordpress.bootstrap.adminExistingSecret }}
                  key: email
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: wordpress-content
              mountPath: /var/www/html
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: wordpress-content
          persistentVolumeClaim:
            claimName: wordpress-content
        - name: bootstrap
          configMap:
            name: store-bootstrap
            defaultMode: 0555
{{- end }}
