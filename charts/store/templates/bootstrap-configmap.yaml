{{- if .Values.wordpress.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: store-bootstrap
  namespace: {{ .Values.global.namespaces.store }}
  labels:
    app.kubernetes.io/name: store-bootstrap
    app.kubernetes.io/part-of: k8s-mcp-gateway
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    wp_args="--path=/var/www/html --allow-root"
    if ! wp core is-installed $wp_args; then
      wp core install $wp_args \
        --url="$SITE_URL" \
        --title="Urumi Demo Store" \
        --admin_user="$WORDPRESS_ADMIN_USER" \
        --admin_password="$WORDPRESS_ADMIN_PASSWORD" \
        --admin_email="$WORDPRESS_ADMIN_EMAIL" \
        --skip-email
    fi

    wp core update --version="$WORDPRESS_VERSION" --force $wp_args
    wp core update-db $wp_args

    if wp config has WP_HOME --type=constant $wp_args; then
      wp config delete WP_HOME --type=constant $wp_args
    fi
    if wp config has WP_SITEURL --type=constant $wp_args; then
      wp config delete WP_SITEURL --type=constant $wp_args
    fi
    wp option update home "$SITE_URL" $wp_args
    wp option update siteurl "$SITE_URL" $wp_args
    wp option update timezone_string "$STORE_TIMEZONE" $wp_args
    wp rewrite structure '/%postname%/' --hard $wp_args

    wp plugin install woocommerce \
      --version="$WOOCOMMERCE_VERSION" \
      --force --activate $wp_args
    wp option update woocommerce_currency "$STORE_CURRENCY" $wp_args
    wp option update woocommerce_cod_settings \
      '{"enabled":"yes","title":"Cash on delivery","description":"Pay with cash upon delivery.","instructions":"Pay with cash upon delivery.","enable_for_methods":[],"enable_for_virtual":"yes"}' \
      --format=json $wp_args

    wp eval '
      $sku = getenv("DEMO_PRODUCT_SKU");
      if (!wc_get_product_id_by_sku($sku)) {
        $product = new WC_Product_Simple();
        $product->set_name(getenv("DEMO_PRODUCT_NAME"));
        $product->set_sku($sku);
        $product->set_regular_price(getenv("DEMO_PRODUCT_PRICE"));
        $product->set_virtual(true);
        $product->set_status("publish");
        $product->set_catalog_visibility("visible");
        $product->set_stock_status("instock");
        $product->save();
      }
    ' $wp_args

    echo "store bootstrap completed"
{{- end }}
