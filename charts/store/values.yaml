global:
  namespaces:
    store: store
    mcp: mcp
  hosts:
    shop: shop.127.0.0.1.nip.io
  ingress:
    className: traefik
    externalPort: 8080
    tls:
      enabled: false
      secretName: ""
  storageClass: local-path
wordpress:
  image: {repository: wordpress, tag: 7.1.3-php8.3-apache}
  service: {name: wordpress, port: 80}
  existingSecret: store-wordpress
  bootstrap:
    enabled: true
    adminExistingSecret: store-wordpress-admin
    cliImage: {repository: wordpress, tag: cli-2.12.0-php8.3}
    wordpressVersion: 7.1.3
    woocommerceVersion: 11.2.1
    timezone: Asia/Kolkata
    currency: INR
    product:
      name: Demo Virtual Product
      sku: urumi-demo-virtual
      price: "499.00"
  persistence: {size: 2Gi}
  probes: {path: /wp-login.php}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
mariadb:
  image: {repository: mariadb, tag: 11.8.3}
  service: {name: mariadb, port: 3306}
  existingSecret: store-mariadb
  persistence: {size: 2Gi}
  probes: {command: healthcheck.sh}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 750m, memory: 768Mi}
